name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-android:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/menu_smart_qr_test
      RESERVATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/menu_smart_qr_test
      IDEMPOTENCY_SECRET: ci-only-reservation-tests-secret-at-least-32-chars
      REQUIRE_RESERVATION_TEST_DATABASE: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: menu_smart_qr_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d menu_smart_qr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npx --yes npm@11.6.2 ci

      - name: Build reservation API
        run: npm run server:build

      - name: Prepare local Supabase-compatible PostgreSQL test schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f server/test/postgres-bootstrap.sql

      - name: Apply reservation API migrations
        run: npm run server:migrate

      - name: Test reservation API
        run: npm run server:test

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Build web app and sync Capacitor
        run: npm run build:mobile

      - name: Build Android debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: menu-smart-qr-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npx --yes npm@11.6.2 ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: npm run test:e2e
