services:
  - type: web
    name: menu-smart-qr-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run server:build
    startCommand: npm run server:deploy
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        value: "postgresql://postgres.vfsxocefazuwoszibjxq@aws-1-eu-west-1.pooler.supabase.com:5432/postgres"
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_SSL
        value: require
      - key: TRUST_PROXY
        value: "true"
      - key: SUPABASE_URL
        value: https://vfsxocefazuwoszibjxq.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: IDEMPOTENCY_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://menu-smart-qr.onrender.com
  - type: web
    name: menu-smart-qr
    runtime: static
    buildCommand: npm ci && npm run build && npm run configure:runtime
    staticPublishPath: ./dist/menu-smart-qr/browser
    envVars:
      - key: API_BASE_URL
        value: https://menu-smart-qr-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html