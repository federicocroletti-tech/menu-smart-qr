<nav
  class="category-nav"
  [attr.aria-label]="translationService.translate('menuCategories')"
>
  <ion-segment
    [value]="activeCategoryId"
    [scrollable]="true"
  >
    @for (category of categories; track category.id) {
      <ion-segment-button
        [value]="category.id"
        [attr.aria-current]="category.id === activeCategoryId ? 'true' : null"
        (click)="categorySelect.emit(category.id)"
      >
        {{ category.name | localizedText }}
      </ion-segment-button>
    }
  </ion-segment>
</nav>
