<nav class="category-nav" aria-label="Menu categories">
  <ion-segment
    [value]="activeCategoryId"
    [scrollable]="true"
  >
    @for (category of categories; track category.id) {
      <ion-segment-button
        [value]="category.id"
        (click)="categorySelect.emit(category.id)"
      >
        {{ category.name | localizedText }}
      </ion-segment-button>
    }
  </ion-segment>
</nav>
