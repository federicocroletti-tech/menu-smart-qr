<section
  class="search-filter"
  [attr.aria-label]="translationService.translate('search')"
>
  <ion-input
    id="menu-search"
    name="menu-search"
    type="search"
    [label]="translationService.translate('search')"
    labelPlacement="stacked"
    [clearInput]="true"
    [(ngModel)]="filter.query"
    (ionInput)="emitChanges()"
  ></ion-input>

  <fieldset class="toggles">
    <legend class="visually-hidden">
      {{ translationService.translate("allCategories") }}
    </legend>
    <label>
      <input
        type="checkbox"
        name="vegetarianOnly"
        [(ngModel)]="filter.vegetarianOnly"
        (change)="emitChanges()"
      />
      {{ translationService.translate("vegetarian") }}
    </label>
    <label>
      <input
        type="checkbox"
        name="veganOnly"
        [(ngModel)]="filter.veganOnly"
        (change)="emitChanges()"
      />
      {{ translationService.translate("vegan") }}
    </label>
    <label>
      <input
        type="checkbox"
        name="glutenFreeOnly"
        [(ngModel)]="filter.glutenFreeOnly"
        (change)="emitChanges()"
      />
      {{ translationService.translate("glutenFree") }}
    </label>
    <label>
      <input
        type="checkbox"
        name="spicyOnly"
        [(ngModel)]="filter.spicyOnly"
        (change)="emitChanges()"
      />
      {{ translationService.translate("spicy") }}
    </label>
    <label>
      <input
        type="checkbox"
        name="recommendedOnly"
        [(ngModel)]="filter.recommendedOnly"
        (change)="emitChanges()"
      />
      {{ translationService.translate("recommended") }}
    </label>
  </fieldset>
</section>
